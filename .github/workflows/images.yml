name: Publish Release

on:
  workflow_call:
    secrets:
      GITLAB_TRIGGER_URL:
        required: false
      GITLAB_TRIGGER_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select or reuse patch release
        id: release
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release.py plan --source-sha "$SOURCE_SHA" --repository "$REPOSITORY"

  images:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, importer, migrator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or verify immutable source image
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: >-
          python3 scripts/release.py image --source-sha "$SOURCE_SHA" --repository "$REPOSITORY"
          --component "$COMPONENT"

  promote:
    needs: [plan, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preflight all four images before promoting any release tag
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: >-
          python3 scripts/release.py promote --source-sha "$SOURCE_SHA" --repository "$REPOSITORY"
          --release-tag "$RELEASE_TAG"

  release:
    needs: [plan, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      handoff: ${{ steps.release.outputs.handoff }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify all images and create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: >-
          python3 scripts/release.py publish --source-sha "$SOURCE_SHA" --repository "$REPOSITORY"
          --release-tag "$RELEASE_TAG"

  handoff:
    needs: [plan, release]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.release.outputs.handoff == 'true' && vars.ENABLE_GITLAB_HANDOFF == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse handoff of a superseded release on retry
        id: current
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: >-
          python3 scripts/release.py handoff-check --source-sha "$SOURCE_SHA" --repository "$REPOSITORY"
          --release-tag "$RELEASE_TAG"
      - name: Request private deployment
        if: steps.current.outputs.handoff == 'true'
        env:
          GITLAB_TRIGGER_URL: ${{ secrets.GITLAB_TRIGGER_URL }}
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/trigger_deployment.py --release-tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
